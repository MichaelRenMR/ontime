x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://ontime:ontime@db:5432/ontime

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ontime
      POSTGRES_PASSWORD: ontime
      POSTGRES_DB: ontime
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontime -d ontime"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  prefect-server:
    # Keep this tag in sync with the prefect==X.Y.Z pin in backend/pyproject.toml.
    image: prefecthq/prefect:3.8.8-python3.12
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://ontime:ontime@db:5432/prefect
    ports:
      - "4200:4200"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  flows:
    <<: *backend
    command: ["python", "-m", "ontime.flows.serve"]
    environment:
      DATABASE_URL: postgresql+psycopg://ontime:ontime@db:5432/ontime
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - ./backend/data/raw:/app/data/raw  # local RawStore; swap RAW_STORE_URL for s3://... in the cloud
    depends_on:
      migrate:
        condition: service_completed_successfully
      prefect-server:
        condition: service_healthy

volumes:
  pgdata:
